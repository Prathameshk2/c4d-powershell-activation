<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#131820"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fdcff"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <radialGradient id="glowAccent" cx="0.72" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#3fdcff" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#3fdcff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#3fdcff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bgGrad)"/>
  <rect width="256" height="256" fill="url(#glowAccent)"/>

  <!-- Subtle grid lines for terminal feel -->
  <g stroke="#e6edf3" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="64" x2="256" y2="64"/>
    <line x1="0" y1="128" x2="256" y2="128"/>
    <line x1="0" y1="192" x2="256" y2="192"/>
    <line x1="64" y1="0" x2="64" y2="256"/>
    <line x1="128" y1="0" x2="128" y2="256"/>
    <line x1="192" y1="0" x2="192" y2="256"/>
  </g>

  <!-- 3D Cube wireframe — rotated, off-center to top-right -->
  <g transform="translate(158 100) rotate(-18)">
    <!-- Back face -->
    <polygon points="-38,-38 38,-38 38,38 -38,38" fill="none" stroke="#e6edf3" stroke-opacity="0.22" stroke-width="1.5"/>
    <!-- Front face offset -->
    <polygon points="-28,-28 36,-28 36,36 -28,36" fill="none" stroke="#3fdcff" stroke-opacity="0.65" stroke-width="1.8"/>
    <!-- Connecting edges -->
    <line x1="-38" y1="-38" x2="-28" y2="-28" stroke="#e6edf3" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="38" y1="-38" x2="36" y2="-28" stroke="#e6edf3" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="38" y1="38" x2="36" y2="36" stroke="#e6edf3" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="-38" y1="38" x2="-28" y2="36" stroke="#e6edf3" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Inner diagonal depth lines (cinematic perspective) -->
    <line x1="-28" y1="-28" x2="-38" y2="-38" stroke="#3fdcff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="36" y1="-28" x2="38" y2="-38" stroke="#3fdcff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="36" y1="36" x2="38" y2="38" stroke="#3fdcff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="-28" y1="36" x2="-38" y2="38" stroke="#3fdcff" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Intersecting cross on front face — subtle depth cue -->
    <line x1="-28" y1="4" x2="36" y2="4" stroke="#f5a623" stroke-opacity="0.15" stroke-width="0.8"/>
    <line x1="4" y1="-28" x2="4" y2="36" stroke="#f5a623" stroke-opacity="0.15" stroke-width="0.8"/>
  </g>

  <!-- Terminal caret fused with cube — large, powerful, off-center left -->
  <g transform="translate(78 154)">
    <!-- Caret chevron — thick, precise, terminal-like -->
    <polyline points="-32,-38 14,0 -32,38" 
              fill="none" 
              stroke="#f5a623" 
              stroke-width="9" 
              stroke-linecap="square" 
              stroke-linejoin="miter"/>
    <!-- Inner glow accent on caret -->
    <polyline points="-32,-38 14,0 -32,38" 
              fill="none" 
              stroke="#3fdcff" 
              stroke-width="2.5" 
              stroke-linecap="square" 
              stroke-linejoin="miter"
              opacity="0.9"/>
    <!-- Caret terminal cursor block -->
    <rect x="22" y="-6" width="18" height="12" fill="#3fdcff" opacity="0.85"/>
    <rect x="22" y="-6" width="18" height="12" fill="none" stroke="#e6edf3" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Orbiting ring segments around cube — rotational power -->
  <g transform="translate(158 100)" stroke="#3fdcff" stroke-width="1.2" fill="none" opacity="0.5">
    <path d="M -52,-8 A 54,54 0 0 1 -20,-48" />
    <path d="M 20,48 A 54,54 0 0 1 52,8" stroke="#f5a623"/>
  </g>

  <!-- Small node dots on the cube corners — precision markers -->
  <g fill="#3fdcff">
    <circle cx="120" cy="62" r="2.2" opacity="0.9"/>
    <circle cx="196" cy="62" r="2.2" opacity="0.9"/>
    <circle cx="196" cy="138" r="2.2" opacity="0.9"/>
    <circle cx="120" cy="138" r="2.2" opacity="0.9"/>
  </g>
  <g fill="#f5a623">
    <circle cx="130" cy="72" r="1.6" opacity="0.7"/>
    <circle cx="194" cy="72" r="1.6" opacity="0.7"/>
  </g>

  <!-- Small terminal prompt underline -->
  <rect x="46" y="200" width="52" height="2" fill="#f5a623" opacity="0.6"/>

  <!-- Wordmark — small, bottom -->
  <text x="46" y="222" font-family="monospace" font-size="9" fill="#e6edf3" opacity="0.55" letter-spacing="1.5">c4d-ps-activate</text>
</svg>
